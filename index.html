<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">

    <!-- LOGIN CONTAINER -->
    <div id="login-container" class="bg-white p-8 rounded-lg shadow-md w-96">
        <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">CRM Login</h2>
        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Username</label>
                <input type="text" id="username" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2">Password</label>
                <input type="password" id="password" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">Login</button>
            <p id="error-msg" class="text-red-500 text-xs mt-4 text-center hidden">Invalid credentials or sheet connection error.</p>
        </form>
    </div>

    <!-- APP CONTAINER (Dito maglo-load ang layouts depende sa role) -->
    <div id="app-container" class="hidden w-full h-full"></div>

    <!-- IMPORT LAYOUTS AT LOGIN HANDLER -->
    <script type="module">
        import { renderBmLayout } from './bmLayout.js';
        import { renderPmLayout } from './pmLayout.js';
        import { renderSaLayout } from './saLayout.js';
        import { renderItLayout } from './itLayout.js';
        import { renderHrLayout } from './hrLayout.js';

        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzXx4Vp68TvQgA4eJVg5AZn7GgnYR9RB3PwCIkOP81o9VMh7o6N7LNz5CG0f90BfY7x/exec";

        window.handleLogin = async function(event) {
            event.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('error-msg');
            errorMsg.classList.add('hidden');

            try {
                const res = await fetch(WEB_APP_URL, {
                    method: "POST",
                    body: JSON.stringify({ username, password })
                });
                
                const result = await res.json();

                if (result.status === "success") {
                    document.getElementById('login-container').classList.add('hidden');
                    const appContainer = document.getElementById('app-container');
                    appContainer.classList.remove('hidden');

                    const user = result.user;

                    // Switch case para sa iba't ibang layout depende sa role mula sa Google Sheet
                    switch (user.role) {
                        case 'BranchManager':
                            renderBmLayout(appContainer, user);
                            break;
                        case 'PageManager':
                            renderPmLayout(appContainer, user);
                            break;
                        case 'ServiceAdvisor':
                            renderSaLayout(appContainer, user);
                            break;
                        case 'IT':
                            renderItLayout(appContainer, user);
                            break;
                        case 'HR':
                            renderHrLayout(appContainer, user);
                            break;
                        default:
                            appContainer.innerHTML = `<div class="p-6 text-red-600 font-bold">Unauthorized Role: ${user.role}</div>`;
                    }
                } else {
                    errorMsg.textContent = result.message;
                    errorMsg.classList.remove('hidden');
                }

            } catch (err) {
                console.error(err);
                errorMsg.textContent = "Connection error to database.";
                errorMsg.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
